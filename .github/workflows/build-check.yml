name: Build check

on:
    # Build only (no deploy) so branches other than `main` can be verified
    push:
        branches: [shirone]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v6
            - name: Install and build
              uses: withastro/action@v6
              with:
                  node-version: 24
